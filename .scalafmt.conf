version = "3.8.3"
runner.dialect = scala213

# Line length before wrapping
maxColumn = 120

# Re-join lines that were split earlier, so old wrapping gets cleaned up
newlines.source = fold

# Align =, :=, -> and trailing // comments in consecutive lines
align.preset = more
align.tokens."+" = [{
  code = ":="
  owners = [{ regex = "Term.ApplyInfix" }]
}]

# Indentation
indent.main = 2
indent.callSite = 2

# Keep short if/else and lambdas on one line when they fit
newlines.beforeCurlyLambdaParams = never
newlines.afterCurlyLambdaParams = never

# Tidy up small things automatically
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers]
rewrite.redundantBraces.stringInterpolation = true

# Leave comments as you wrote them
docstrings.wrap = no
comments.wrap = no